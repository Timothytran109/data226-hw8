services:
  mlflow:
    image: python:3.12-slim
    container_name: hw8-mlflow
    working_dir: /mlflow
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "
      pip install --no-cache-dir mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      "
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hw8-trainer
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
    depends_on:
      - mlflow
    stdin_open: true
    tty: true
    command: tail -f /dev/null

volumes:
  mlflow_data:
